<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="cv"></canvas>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const A=window.Android||{getMood:()=> 'happy',getEaten:()=>0,setEaten:()=>{},vibrate:()=>{},soundOn:()=>false};

const PAL={
  happy:{core:[255,246,196],mid:[255,176,64],edge:[255,104,48]},
  shy:{core:[255,238,240],mid:[255,150,182],edge:[246,92,138]},
  sleepy:{core:[255,226,170],mid:[236,140,74],edge:[178,78,52]},
  angry:{core:[255,224,150],mid:[255,92,44],edge:[214,36,30]},
  cold:{core:[232,246,255],mid:[120,190,255],edge:[64,112,240]}
};
const P={
  happy:{size:1,flick:1,wob:1,tip:1.05,eyes:'normal'},
  shy:{size:.92,flick:.8,wob:.8,tip:.9,eyes:'shy'},
  sleepy:{size:.85,flick:.45,wob:.6,tip:.7,eyes:'sleepy'},
  angry:{size:1.1,flick:2.2,wob:1.8,tip:1.25,eyes:'angry'},
  cold:{size:.8,flick:1.3,wob:1.1,tip:.8,eyes:'cold'}
};

let W=0,H=0;
let mood=String(A.getMood()||'happy'); if(!PAL[mood])mood='happy';
let eaten=+A.getEaten()||0;
const pet={col:{core:[...PAL[mood].core],mid:[...PAL[mood].mid],edge:[...PAL[mood].edge]},
  size:1,flick:1,wob:1,tip:1,s:0,sv:0,hy:0,hv:0,hopIn:3,lean:.26,vx:0,
  blink:0,blinkT:0,nextBlink:3,look:{x:0,y:0},lookT:{x:0,y:0},lookIn:0,
  petting:false,petAmt:0,sleep:0,lastAct:performance.now(),
  puffT:0,chewT:0,feedBoost:0,orbit:0,wispIn:0,zIn:0,dragging:false,fear:0,height:0,reliefT:0,fearBuzz:false,yawnT:0,yawnIn:6,yawnFx:0,steamT:0};
const parts=[],sticks=[];

function resize(){const dpr=Math.min(3,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const lerp=(a,b,k)=>a+(b-a)*k;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const soundEnabled=()=>{try{return !!A.soundOn()}catch(e){return false}};
const SND=(function(){
  let ac=null,out=null,nb=null;
  function get(){
    if(!ac){try{const C=window.AudioContext||window.webkitAudioContext;ac=new C();out=ac.createGain();out.gain.value=.55;out.connect(ac.destination)}catch(e){ac=null;return null}}
    if(ac.state==='suspended'){try{ac.resume()}catch(e){}}
    return ac;
  }
  function env(g,t,a,p,d,gain){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(gain,t+a);g.gain.setValueAtTime(gain,t+a+p);g.gain.exponentialRampToValueAtTime(.0001,t+a+p+d)}
  function noise(a,t,o){
    if(!nb){nb=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const c=nb.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),p=o.p||0,len=o.a+p+o.d;
    s.buffer=nb;f.type=o.type;f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f0,t);f.frequency.linearRampToValueAtTime(o.f1!=null?o.f1:o.f0,t+len);
    env(g,t,o.a,p,o.d,o.gain);s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random());s.stop(t+len+.05)}
  function tone(a,t,o){
    const osc=a.createOscillator(),g=a.createGain(),p=o.p||0,len=o.a+p+o.d;osc.type=o.wave||'sine';
    osc.frequency.setValueAtTime(o.f0,t);osc.frequency.exponentialRampToValueAtTime(o.f1||o.f0,t+len);
    env(g,t,o.a,p,o.d,o.gain);let n=osc;
    if(o.lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;osc.connect(f);n=f}
    n.connect(g);g.connect(out);osc.start(t);osc.stop(t+len+.05)}
  function play(fn,dl){if(!soundEnabled())return;const a=get();if(!a)return;try{fn(a,a.currentTime+.02+(dl||0))}catch(e){}}
  return{
    unlock(){get()},
    puff:()=>play((a,t)=>{noise(a,t,{type:'bandpass',f0:1100,f1:350,q:1.4,a:.01,d:.17,gain:.5});tone(a,t,{f0:330,f1:150,a:.005,d:.12,gain:.18})}),
    crunch:()=>play((a,t)=>{for(let i=0;i<3;i++)noise(a,t+i*.12,{type:'highpass',f0:2600,f1:1700,q:.8,a:.004,d:.06,gain:.32})}),
    yawn:dl=>play((a,t)=>{tone(a,t,{wave:'triangle',f0:300,f1:520,a:.3,d:.01,gain:.07,lp:1400});tone(a,t+.31,{wave:'triangle',f0:520,f1:280,a:.05,p:.45,d:.7,gain:.07,lp:1400});noise(a,t,{type:'lowpass',f0:900,f1:600,a:.45,p:.45,d:.6,gain:.12})},dl),
    snore:()=>play((a,t)=>{noise(a,t,{type:'lowpass',f0:280,f1:520,q:3,a:.9,d:.4,gain:.35});tone(a,t,{wave:'sawtooth',f0:68,f1:84,a:.9,d:.4,gain:.06,lp:260});
      tone(a,t+1.45,{f0:1250,f1:700,a:.08,p:.15,d:.45,gain:.045});noise(a,t+1.45,{type:'bandpass',f0:1600,f1:900,q:2,a:.08,p:.1,d:.5,gain:.06})}),
    whoop:()=>play((a,t)=>{tone(a,t,{f0:400,f1:900,a:.01,d:.18,gain:.07})}),
    boing:()=>play((a,t)=>{tone(a,t,{f0:320,f1:180,a:.005,d:.2,gain:.1});tone(a,t+.02,{wave:'triangle',f0:640,f1:420,a:.005,d:.12,gain:.03})}),
    hop:()=>play((a,t)=>{tone(a,t,{f0:520,f1:780,a:.005,d:.07,gain:.05})}),
    coo:()=>play((a,t)=>{tone(a,t,{wave:'triangle',f0:600,f1:780,a:.05,d:.18,gain:.06,lp:1800});tone(a,t+.2,{wave:'triangle',f0:780,f1:650,a:.03,d:.28,gain:.05,lp:1800})}),
    huff:()=>play((a,t)=>{noise(a,t,{type:'bandpass',f0:700,f1:300,a:.01,d:.22,gain:.35});tone(a,t,{wave:'sawtooth',f0:160,f1:110,a:.01,d:.15,gain:.05,lp:500})}),
    chatter:()=>play((a,t)=>{for(let i=0;i<4;i++)noise(a,t+i*.07,{type:'highpass',f0:3000,a:.003,d:.03,gain:.13})}),
    chirp:()=>play((a,t)=>{tone(a,t,{f0:500,f1:1000,a:.01,d:.16,gain:.07})}),
    chime:()=>play((a,t)=>{tone(a,t,{f0:880,a:.005,d:.35,gain:.05});tone(a,t+.08,{f0:1320,a:.005,d:.4,gain:.035})}),
    crackle:()=>play((a,t)=>{const n=1+(Math.random()*3|0);for(let i=0;i<n;i++)noise(a,t+i*(.04+Math.random()*.08),{type:'highpass',f0:1800+Math.random()*1200,a:.002,d:.015+Math.random()*.02,gain:.05+Math.random()*.04})}),
    drop:()=>play((a,t)=>{tone(a,t,{f0:1400,f1:500,a:.01,d:.35,gain:.04})}),
    steam:()=>play((a,t)=>{noise(a,t,{type:'bandpass',f0:600,a:.01,d:.25,gain:.3});
      noise(a,t+.05,{type:'bandpass',f0:3200,f1:1800,q:.7,a:.12,p:1.6,d:1.1,gain:.2});
      tone(a,t,{wave:'sawtooth',f0:95,f1:70,a:.08,p:.3,d:.6,gain:.06,lp:320})}),
    sigh:()=>play((a,t)=>{noise(a,t,{type:'lowpass',f0:1500,f1:500,a:.08,p:.2,d:.7,gain:.28})}),
    squeak:()=>play((a,t)=>{tone(a,t,{f0:880,f1:1500,a:.01,d:.13,gain:.09});tone(a,t+.15,{f0:1400,f1:1100,a:.01,d:.12,gain:.07})})
  };
})();
const baseR=()=>Math.min(W*.24,H*.18);
const R=()=>baseR()*pet.size*(1+Math.min(.2,eaten*.008))*(1+pet.feedBoost*.2);
const CX=()=>W/2, CY=()=>H*.64;

function wake(){const was=pet.sleep>.5;pet.yawnT=0;pet.lastAct=performance.now();return was}
function spawnSparks(n,x,y,spread,speed){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*spread,v=speed*(.6+Math.random()*.8);
  parts.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:.6+Math.random()*.5,r:1.2+Math.random()*1.8})}}

window.pet={
  touch(){},
  puff(){
    const woke=wake(),r=R(),cx=CX(),cy=CY()+pet.hy;
    pet.sv+=7;pet.puffT=.45;SND.puff();
    parts.push({k:'ring',x:cx,y:cy+r*.32,r:r*.12,life:0,max:1});
    spawnSparks(8,cx,cy-r*.6,2.2,110);
    if(woke)SND.chirp();
    parts.push({k:'text',s:woke?'噗？':'噗！',x:cx+r*.35,y:cy-r*1.5,life:0,max:1.1});
  },
  feed(){wake();SND.drop();sticks.push({x:CX()+(Math.random()-.5)*16,y:-14,vy:0,rot:Math.random()*2,vr:4+Math.random()*3})},
  longPressStart(){wake();pet.petting=true},
  longPressEnd(){pet.petting=false},
  dragStart(){wake();pet.dragging=true;SND.whoop()},
  dragMove(vx,h){pet.vx=lerp(pet.vx,vx,.4);if(h!=null)pet.height=h;pet.lastAct=performance.now()},
  dragEnd(){const scared=pet.fear>.3;pet.dragging=false;pet.vx=0;if(scared)relief();else{pet.sv+=8;SND.boing()}},
  setMood(m){if(PAL[m]){if(m==='sleepy'&&mood!=='sleepy')pet.yawnIn=6;if(m!==mood)SND.chime();mood=m;wake();pet.sv+=4}}
};

function shape(cx,cy,r,o,t){
  const pts=[],N=64;
  for(let i=0;i<N;i++){
    const th=i/N*Math.PI*2-Math.PI/2,c=Math.cos(th),s=Math.sin(th),u=Math.max(0,-s);
    const n=(Math.sin(3*th+t*2.3*o.f)*.045+Math.sin(5*th-t*3.7*o.f)*.03+Math.sin(7*th+t*5.1*o.f)*.015)*o.w;
    const rr=r*(1+n);let x=c*rr*o.sx,y=s*rr*o.sy;if(s>0)y*=.9;
    y-=Math.pow(u,5)*r*o.tip*(1+.12*Math.sin(t*6*o.f));
    x+=o.lean*r*Math.pow(u,2.2)+Math.pow(u,4)*r*.15*Math.sin(t*3*o.f);
    pts.push([cx+x,cy+y]);
  }
  return pts;
}
function path(pts){ctx.beginPath();const n=pts.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let s=m(pts[n-1],pts[0]);ctx.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const p=pts[i],q=m(p,pts[(i+1)%n]);ctx.quadraticCurveTo(p[0],p[1],q[0],q[1])}ctx.closePath()}
function ell(x,y,w,h){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,w),Math.max(.1,h),0,0,Math.PI*2);ctx.fill()}

function drawEyes(cx,cy,r,kind,t){
  const ink='#3b1d2e';ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(1.8,r*.05);
  for(const side of [-1,1]){
    const sz=side<0?1:.8;let x=cx+side*.4*r+pet.look.x,y=cy+.1*r+pet.look.y;const w=.085*r*sz,h=.12*r*sz;
    if(kind==='cold')x+=Math.sin(t*33+side)*.7;
    const hl=(ww,hh)=>{ctx.fillStyle='rgba(255,255,255,.9)';ell(x-ww*.3,y-hh*.38,ww*.34,ww*.34);ctx.fillStyle=ink};
    switch(kind){
      case 'normal':{const hh=h*(1-pet.blink*.92);ell(x,y,w,hh);if(pet.blink<.5)hl(w,hh);break}
      case 'wow':ell(x,y,w*1.3,h*1.3);hl(w*1.3,h*1.3);break;
      case 'shy':ctx.beginPath();ctx.moveTo(x-w*1.1,y+h*.35);ctx.quadraticCurveTo(x,y-h*1.1,x+w*1.1,y+h*.35);ctx.stroke();break;
      case 'sleepy':ell(x,y+h*.35,w,h*.45*(1-pet.blink*.8));break;
      case 'sleep':ctx.beginPath();ctx.moveTo(x-w,y);ctx.quadraticCurveTo(x,y+h*.9,x+w,y);ctx.stroke();break;
      case 'squeezeIn':ctx.beginPath();ctx.moveTo(x+side*w,y-h*.75);ctx.lineTo(x-side*w*.6,y);ctx.lineTo(x+side*w,y+h*.75);ctx.stroke();break;
      case 'squeeze':ctx.beginPath();ctx.moveTo(x-side*w,y-h*.75);ctx.lineTo(x+side*w*.6,y);ctx.lineTo(x-side*w,y+h*.75);ctx.stroke();break;
      case 'angry':{const hh=h*(1-pet.blink*.92);ell(x,y+h*.15,w,hh*.9);ctx.beginPath();ctx.moveTo(x+side*w*1.3,y-h*1.4);ctx.lineTo(x-side*w*1.2,y-h*.75);ctx.stroke();break}
      case 'cold':ell(x,y,w*.6,w*.6);break;
      case 'squint':{ctx.lineWidth=Math.max(2,r*.065);ctx.beginPath();ctx.moveTo(x+side*w*1.25,y-h*.05);ctx.quadraticCurveTo(x,y+h*.05,x-side*w*1.2,y+h*.28);ctx.stroke();
        ctx.lineWidth=Math.max(1.8,r*.05);ctx.beginPath();ctx.moveTo(x+side*w*1.35,y-h*1.25);ctx.lineTo(x-side*w*1.2,y-h*.55);ctx.stroke();break}
      case 'yawn':{const c=pet.yawnC||0;if(c<.8)ell(x,y+h*.35,w,h*.45*(1-c/.8)+.3);
        else{ctx.beginPath();ctx.moveTo(x-w*1.1,y+h*.35);ctx.quadraticCurveTo(x,y-h*.1,x+w*1.1,y+h*.35);ctx.stroke()}break}
      case 'scared':{const jx=Math.sin(t*55+side*3)*w*.22,jy=Math.cos(t*47+side)*w*.12,d=w*.5;
        ell(x+jx,y+jy,d,d);ctx.fillStyle='rgba(255,255,255,.9)';ell(x+jx-d*.35,y+jy-d*.35,d*.32,d*.32);
        ctx.fillStyle=ink;break}
      case 'relieved':ctx.beginPath();ctx.moveTo(x-w*1.1,y);ctx.quadraticCurveTo(x,y+h*.8,x+w*1.1,y);ctx.stroke();break;
    }
  }
}
function relief(){const r=R(),cx=CX(),cy=CY()+pet.hy;pet.reliefT=1.4;SND.sigh();pet.fear=0;pet.sv+=4;
  for(let i=0;i<3;i++)parts.push({k:'sigh',x:cx+r*.05,y:cy+r*.3,vx:20+i*7,vy:-16-i*9,life:-i*.12,max:1.6,r:r*.09});
  parts.push({k:'text',s:'呼～',x:cx+r*.35,y:cy-r*1.5,life:0,max:1.3});try{A.vibrate(10)}catch(e){}}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;

  const hr=new Date().getHours(),night=hr>=23||hr<6;
  const idle=(now-pet.lastAct)/1000;
  const sleepT=(idle>(mood==='sleepy'?(night?70:150):(night?15:45))&&!pet.dragging&&!pet.petting)?1:0;
  pet.sleep=lerp(pet.sleep,sleepT,Math.min(1,dt*(sleepT?.5:4)));
  if(pet.petting){pet.petAmt=Math.min(1.6,pet.petAmt+dt*1.3);pet.lastAct=now}
  pet.petAmt=Math.max(0,pet.petAmt-dt*.3);
  const shy=mood==='shy'?0:Math.min(1,pet.petAmt);

  const fearT=pet.dragging?Math.max(0,Math.min(1,(pet.height-.55)/.3)):0;
  pet.fear=lerp(pet.fear,fearT,Math.min(1,dt*(fearT>pet.fear?5:3)));pet.reliefT=Math.max(0,pet.reliefT-dt);
  if(shy>.6&&!pet.cooed){pet.cooed=true;SND.coo()}if(shy<.2)pet.cooed=false;
  if(mood==='angry'&&pet.sleep<.5&&pet.steamT<=0){pet.huffIn=(pet.huffIn==null?2:pet.huffIn)-dt;if(pet.huffIn<=0){pet.huffIn=4+Math.random()*3;SND.huff()}}
  if(mood==='cold'&&pet.sleep<.5){pet.chatIn=(pet.chatIn==null?2:pet.chatIn)-dt;if(pet.chatIn<=0){pet.chatIn=5+Math.random()*3;SND.chatter()}}
  if(pet.sleep<.5){pet.crackIn=(pet.crackIn==null?2:pet.crackIn)-dt;if(pet.crackIn<=0){pet.crackIn=2+Math.random()*4;SND.crackle()}}
  if(mood==='angry'&&pet.sleep<.5&&!pet.dragging&&pet.puffT<=0&&pet.chewT<=0){pet.steamIn=(pet.steamIn==null?5:pet.steamIn)-dt;
    if(pet.steamIn<=0&&pet.steamT<=0){pet.steamT=3;pet.steamIn=10+Math.random()*5;SND.steam()}}
  else if(mood!=='angry'){pet.steamT=0;pet.steamIn=5}
  if(pet.steamT>0)pet.steamT=Math.max(0,pet.steamT-dt);
  const canYawn=mood==='sleepy'&&pet.sleep<.5&&!pet.dragging&&!(pet.petting)&&pet.puffT<=0&&pet.chewT<=0;
  if(canYawn){pet.yawnIn-=dt;if(pet.yawnIn<=0&&pet.yawnT<=0){pet.yawnT=3.4;SND.yawn(.25);pet.yawnIn=45+Math.random()*10;pet.yawnFx=0}}
  else if(pet.yawnT>0&&(mood!=='sleepy'||pet.dragging))pet.yawnT=0;
  if(pet.yawnT>0)pet.yawnT=Math.max(0,pet.yawnT-dt);
  const yp=pet.yawnT>0?1-pet.yawnT/3.4:0,ysm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)},
    ye=pet.yawnT>0?ysm(0,.4,yp)*(1-ysm(.62,.88,yp)):0;
  pet.yawnC=pet.yawnT>0?ysm(0,.3,yp)*(1-ysm(.82,1,yp)):0;
  const mp=PAL[mood],pp=P[mood];
  let core=mix(mp.core,PAL.shy.core,shy),mid=mix(mp.mid,PAL.shy.mid,shy),edge=mix(mp.edge,PAL.shy.edge,shy);
  core=mix(core,PAL.sleepy.core,pet.sleep*.7);mid=mix(mid,PAL.sleepy.mid,pet.sleep*.8);edge=mix(edge,PAL.sleepy.edge,pet.sleep*.8);
  {const pale=[255,240,214];core=mix(core,pale,pet.fear*.5);mid=mix(mid,pale,pet.fear*.35)}
  const k=Math.min(1,dt*3);
  pet.col.core=mix(pet.col.core,core,k);pet.col.mid=mix(pet.col.mid,mid,k);pet.col.edge=mix(pet.col.edge,edge,k);
  pet.size=lerp(pet.size,pp.size*(1-.38*pet.sleep)*(1-.12*pet.fear)*(pet.steamT>0?1.08:1),k);
  pet.flick=lerp(pet.flick,pp.flick*(1-.6*pet.sleep),k);
  pet.wob=lerp(pet.wob,pp.wob*(1-.5*pet.sleep),k);
  pet.tip=lerp(pet.tip,pp.tip*(1-.55*pet.sleep)*(1-.3*pet.fear),k);
  pet.feedBoost=Math.max(0,pet.feedBoost-dt*.05);

  pet.sv+=(-170*pet.s-9*pet.sv)*dt;pet.s+=pet.sv*dt;
  if(mood==='happy'&&pet.sleep<.2&&!pet.dragging&&!pet.petting){pet.hopIn-=dt;if(pet.hopIn<=0&&pet.hy===0){pet.hv=-200;SND.hop();pet.hopIn=3+Math.random()*4;pet.sv-=3}}
  if(pet.hy<0||pet.hv<0){pet.hv+=900*dt;pet.hy+=pet.hv*dt;if(pet.hy>=0){pet.hy=0;pet.hv=0;pet.sv+=5}}
  if(!pet.dragging)pet.vx=lerp(pet.vx,0,Math.min(1,dt*6));
  pet.lean=lerp(pet.lean,.26-Math.max(-.7,Math.min(.7,pet.vx*.0025)),Math.min(1,dt*8));

  pet.nextBlink-=dt;if(pet.nextBlink<=0){pet.blinkT=.16;pet.nextBlink=2+Math.random()*3.5}
  if(pet.blinkT>0){pet.blinkT-=dt;pet.blink=Math.sin(Math.max(0,pet.blinkT)/.16*Math.PI)}else pet.blink=0;

  if(pet.fear>.5&&!pet.fearBuzz){pet.fearBuzz=true;SND.squeak();try{A.vibrate(12)}catch(e){}}if(pet.fear<.2)pet.fearBuzz=false;
  const r=R(),cx=CX()+(mood==='cold'&&pet.sleep<.5?Math.sin(t*38)*1.2:0)+Math.sin(t*47)*1.6*pet.fear,cy=CY()+pet.hy;
  pet.lookIn-=dt;if(pet.lookIn<=0){pet.lookIn=1.5+Math.random()*3;pet.lookT={x:(Math.random()-.5)*r*.14,y:(Math.random()-.5)*r*.08}}
  let lt=pet.lookT;if(pet.dragging)lt={x:Math.max(-1,Math.min(1,-pet.vx/400))*r*.08,y:-r*.03};if(pet.sleep>.6)lt={x:0,y:0};

    if(s.y>=CY()+pet.hy-r*.2){sticks.splice(i,1);eaten++;try{A.setEaten(eaten)}catch(e){}
      pet.chewT=1.1;SND.crunch();pet.feedBoost=Math.min(.6,pet.feedBoost+.3);pet.sv+=6;try{A.vibrate(20)}catch(e){}
      spawnSparks(14,CX(),CY()-r*.3,2.6,130);parts.push({k:'text',s:'咔嚓',x:CX()+r*.3,y:CY()-r*1.5,life:0,max:1})}}

  ctx.clearRect(0,0,W,H);

  const gy=CY()+r*1.05,lift=Math.max(.4,1+pet.hy/150);
  let g=ctx.createRadialGradient(cx,gy,0,cx,gy,r*1.3);g.addColorStop(0,rgba(C.mid,.3*lift));g.addColorStop(1,rgba(C.mid,0));

  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy-r*.3,r*2.2,0,Math.PI*2);ctx.fill();

  const oa=pet.orbit,ox=cx+Math.cos(oa)*r*1.45,oy=cy-r*.15+Math.sin(oa)*r*.35,front=Math.sin(oa)>0;
  const drawOrb=()=>{const os=r*.075*(front?1:.75),a=front?1:.55;const og=ctx.createRadialGradient(ox,oy,0,ox,oy,os*3.5);
    og.addColorStop(0,rgba(C.core,a));og.addColorStop(.3,rgba(C.mid,a*.8));og.addColorStop(1,rgba(C.mid,0));ctx.fillStyle=og;ctx.beginPath();ctx.arc(ox,oy,os*3.5,0,Math.PI*2);ctx.fill()};
  if(!front)drawOrb();

  const breath=Math.sin(t*Math.PI*2/4),air=pet.hy<0?Math.min(1,-pet.hv/400):0;
  const o={f:pet.flick,w:pet.wob,tip:pet.tip*(1+air*.2+ye*.3),lean:pet.lean-ye*.15,sx:1-ye*.07+pet.s*.22+breath*.025-air*.06,sy:1+ye*.12-pet.s*.22+breath*.04+air*.08};
  ctx.save();ctx.shadowColor=rgba(C.edge,.75);ctx.shadowBlur=r*.6;
  g=ctx.createRadialGradient(cx,cy+r*.2,0,cx,cy+r*.1,r*1.7);g.addColorStop(0,rgba(C.core,1));g.addColorStop(.42,rgba(C.mid,1));g.addColorStop(1,rgba(C.edge,1));
  ctx.fillStyle=g;path(shape(cx,cy,r,o,t));ctx.fill();ctx.restore();
  ctx.fillStyle=rgba(C.core,.55);path(shape(cx,cy+r*.2,r*.55,{...o,tip:o.tip*.8,w:o.w*1.3},t+1.7));ctx.fill();

  let kind=pp.eyes;

  drawEyes(cx,cy,r,kind,t);
  if(kind==='scared'){ctx.strokeStyle='#3b1d2e';ctx.lineWidth=Math.max(1.4,r*.035);ctx.beginPath();const my=cy+r*.36,mx=cx+pet.look.x*.6;
    for(let j=0;j<=4;j++){const xx=mx-r*.12+j*r*.06,yy=my+(j%2?-1:1)*r*.022;j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}
  if(pet.reliefT>.9){ctx.fillStyle='#3b1d2e';ell(cx+pet.look.x*.6,cy+r*.33,r*.045,r*.055)}
  if(pet.yawnT>0){const sm=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
    let op=sm(.08,.5,yp)*(1-sm(.66,.84,yp));if(yp>.45&&yp<.66)op*=1+.04*Math.sin(t*20);
    const mx=cx+pet.look.x*.5,my=cy+r*.36;
    if(op>.02){ctx.fillStyle='#3b1d2e';ell(mx,my+r*.02*op,r*(.05+.06*op),r*.15*op);ctx.fillStyle='#ff8fa8';ell(mx,my+r*.1*op,r*.055*op,r*.04*op)}
    if(yp>.84&&yp<.96){const ch=Math.abs(Math.sin((yp-.84)/.12*Math.PI*2));ctx.fillStyle='#3b1d2e';ell(mx,my,r*.04,r*.012+r*.025*ch)}
    if(!pet.yawnFx&&yp>.45){pet.yawnFx=1;parts.push({k:'text',s:'哈～',x:cx+r*.4,y:cy-r*1.3,life:0,max:1.8})}
    if(pet.yawnFx===1&&yp>.72){pet.yawnFx=2;SND.sigh();parts.push({k:'sigh',x:cx,y:cy+r*.3,vx:10,vy:-10,life:0,max:1.8,r:r*.07})}
    if(pet.yawnFx===2&&yp>.84){pet.yawnFx=3;pet.sv+=3}}
  if(pet.fear>.25){const a=Math.min(1,(pet.fear-.25)*2),sx=cx+r*.66,sy=cy-r*.32+((t*.6)%1)*r*.12,sr=r*.07;
    ctx.fillStyle=`rgba(175,220,255,${a*.9})`;ctx.beginPath();ctx.moveTo(sx,sy-sr*1.8);ctx.quadraticCurveTo(sx+sr*1.1,sy-sr*.2,sx,sy+sr);ctx.quadraticCurveTo(sx-sr*1.1,sy-sr*.2,sx,sy-sr*1.8);ctx.fill()}
  if(pet.puffT>0){ctx.fillStyle='#3b1d2e';ell(cx+pet.look.x*.6,cy+r*.32,r*.05,r*.06*(.6+pet.puffT))}
  if(pet.chewT>0){ctx.fillStyle='#3b1d2e';ell(cx+pet.look.x*.6,cy+r*.32,r*.06,r*.035*(1+Math.abs(Math.sin(t*18))))}
  if(front)drawOrb();

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;const q=p.life/p.max;if(q>=1){parts.splice(i,1);continue}
    if(p.life<0)continue;
    if(p.k==='spark'){p.vy+=60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;ctx.fillStyle=rgba(mix(C.core,C.mid,q),1-q);ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-q*.5),0,Math.PI*2);ctx.fill()}
    else if(p.k==='ring'){ctx.strokeStyle=`rgba(214,204,230,${.75*(1-q)})`;ctx.lineWidth=Math.max(1.4,r*.05*(1-q));ctx.beginPath();const rr=p.r+q*r*.4;ctx.ellipse(p.x+q*r*.35,p.y-q*r*1.1,rr,rr*.55,0,0,Math.PI*2);ctx.stroke()}

    else if(p.k==='wisp'){p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.fillStyle=`rgba(150,140,165,${.45*(1-q)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+q*1.5),0,Math.PI*2);ctx.fill()}
    else if(p.k==='text'){ctx.font=`bold ${Math.round(r*.4)}px sans-serif`;ctx.lineWidth=3;ctx.strokeStyle=`rgba(40,28,52,${.6*(1-q*q)})`;ctx.strokeText(p.s,p.x,p.y-q*22);ctx.fillStyle=`rgba(255,244,230,${1-q*q})`;ctx.fillText(p.s,p.x,p.y-q*22)}

  }

}

})();
