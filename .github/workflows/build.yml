name: 打包噗噗安装包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk pupu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pupu-apk
          path: pupu.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 噗噗 v0.1.${{ github.run_number }}
          body: 在手机上点下面的 pupu.apk 下载安装。
          files: pupu.apk
